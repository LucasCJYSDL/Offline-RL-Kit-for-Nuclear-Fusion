name: offline-rl-fusion
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.9.18
  - pip
  - graphviz
  - hdf5
  - pytables

  - pip:
      # PyTorch CUDA 11.8 wheels are not on the default PyPI index.
      - --extra-index-url https://download.pytorch.org/whl/cu118

      # Core numerical / scientific stack
      - numpy==1.26.4
      - scipy==1.11.4
      - pandas==2.1.1
      - scikit-learn==0.24.2
      - h5py==3.14.0
      - tables==3.9.2

      # Plotting / logging
      - matplotlib==3.4.3
      - seaborn==0.13.2
      - plotly==6.2.0
      - tensorboard==2.19.0
      - tensorboardx==2.6.2.2
      - graphviz==0.20.1

      # PyTorch stack
      - torch==2.1.0+cu118
      - torchvision==0.16.0+cu118
      - torchaudio==2.1.0+cu118
      - pytorch-lightning==1.4.2
      - torchmetrics==0.6.0

      # RL / optimization
      - gym==0.26.2
      - gymnasium==0.29.1
      - stable-baselines3==2.1.0
      - optuna==4.6.0
      - catboost==1.2.8
      - uncertainty-toolbox==0.1.1

      # Config / utilities
      - hydra-core==1.1.1
      - omegaconf==2.1.2
      - easydict==1.13
      - cloudpickle==3.0.0
      - tqdm==4.62.3
      - tabulate==0.9.0
      - requests==2.31.0
      - pyyaml==6.0.1
      - imageio==2.31.5
      - joblib==1.3.2

      # TensorFlow-related packages.
      # Keep these only if the codebase actually uses TensorFlow/Keras.
      - tensorflow==2.19.0
      - keras==3.10.0
      - tf-keras==2.19.0
