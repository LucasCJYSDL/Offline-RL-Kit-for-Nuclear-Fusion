experiment_name: "rpnn_noshape_gas_curriculum"
# save_path: "/home/scratch/rsonker/ech/dynamics_models/rpnn_qrfe_all_gauss1params_v2_nllmse"
# data_path: "/home/scratch/rsonker/ech/data/organized/noshape_qrfe_all_gauss1params_v2"

#save_path: "/home/scratch/rsonker/dynamics_models/rpnn_noshape_gas_benchmark_step1"
